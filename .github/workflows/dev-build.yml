name: Dev Build

# Runs on every push to master: builds the plugin for every supported
# Minecraft version and publishes the jars as a pre-release tagged
# dev-1, dev-2, dev-3, ... (continuous numbering).

on:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  number:
    name: Pick dev number
    runs-on: ubuntu-latest
    outputs:
      n: ${{ steps.next.outputs.n }}
    steps:
      - name: Find next dev-X number
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LAST=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' \
            | grep -E '^dev-[0-9]+$' | sed 's/^dev-//' | sort -n | tail -1)
          echo "n=$(( ${LAST:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    name: Build MC ${{ matrix.mc }}
    needs: number
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.16.5",  java: "8"  }
          - { mc: "1.17.1",  java: "16" }
          - { mc: "1.18.2",  java: "17" }
          - { mc: "1.19.4",  java: "17" }
          - { mc: "1.20.4",  java: "17" }
          - { mc: "1.20.6",  java: "21" }
          - { mc: "1.21.4",  java: "21" }
          - { mc: "1.21.11", java: "21" }
          - { mc: "26.3",    java: "21" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute dev version
        run: |
          BASE=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)
          echo "VERSION=${BASE}-dev-${{ needs.number.outputs.n }}" >> "$GITHUB_ENV"

      - name: Build
        run: >
          mvn -B --no-transfer-progress clean package
          -Drevision=${{ env.VERSION }}
          -Dspigot.version=${{ matrix.mc }}
          -Djava.release=${{ matrix.java }}

      - uses: actions/upload-artifact@v5
        with:
          name: RedstoneSpawners-mc${{ matrix.mc }}
          path: target/RedstoneSpawners-*.jar

  release:
    name: Publish dev-${{ needs.number.outputs.n }}
    needs: [ number, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: jars
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-${{ needs.number.outputs.n }}
        run: |
          NOTES="Automatic development build of master at commit $GITHUB_SHA. Not a stable release. Pick the jar matching your server's Minecraft version."
          gh release create "$TAG" jars/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build $TAG (${GITHUB_SHA::7})" \
            --notes "$NOTES"
