name: Release

# Manually triggered: builds every supported Minecraft version and
# publishes a stable GitHub release tagged v<version>.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.1.0)'
        required: true
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { mc: "1.16.5",  java: "8"  }
          - { mc: "1.17.1",  java: "16" }
          - { mc: "1.18.2",  java: "17" }
          - { mc: "1.19.4",  java: "17" }
          - { mc: "1.20.4",  java: "17" }
          - { mc: "1.20.6",  java: "21" }
          - { mc: "1.21.4",  java: "21" }
          - { mc: "1.21.11", java: "21" }
          - { mc: "26.3",    java: "21" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: >
          mvn -B --no-transfer-progress clean package
          -Drevision=${{ inputs.version }}
          -Dspigot.version=${{ matrix.mc }}
          -Djava.release=${{ matrix.java }}

      - uses: actions/upload-artifact@v5
        with:
          name: RedstoneSpawners-mc${{ matrix.mc }}
          path: target/RedstoneSpawners-*.jar

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: jars
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$NOTES" ]; then
            NOTES="Pick the jar matching your server's Minecraft version."
          fi
          gh release create "v$VERSION" jars/*.jar \
            --target "$GITHUB_SHA" \
            --title "RedstoneSpawners v$VERSION" \
            --notes "$NOTES"
